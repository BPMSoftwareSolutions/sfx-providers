<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 960 540"><rect width="960" height="540" fill="#06111f"/><text x="38" y="56" font-family="Arial" font-size="31" font-weight="700" fill="#f4f7fb" text-anchor="start"><tspan x="38" dy="0">Blueprint review</tspan></text><text x="40" y="94" font-family="Arial" font-size="14" font-weight="400" fill="#a8b8ca" text-anchor="start"><tspan x="40" dy="0">EVIDENCE INCOMPLETE · SOURCE-BOUND FINDINGS</tspan></text><text x="927" y="523" font-family="Arial" font-size="10" font-weight="400" fill="#a8b8ca" text-anchor="end"><tspan x="927" dy="0">09</tspan></text><text x="40" y="153" font-family="Arial" font-size="15" font-weight="700" fill="#f6b94d" text-anchor="start"><tspan x="40" dy="0">R01 · WARNING · BINDING NOT INVOKED</tspan></text><text x="41" y="180" font-family="Arial" font-size="13" font-weight="400" fill="#f4f7fb" text-anchor="start"><tspan x="41" dy="0">Binding read-capability-dsl-source-port has no invoking operation in the selected graph.</tspan></text><text x="40" y="235" font-family="Arial" font-size="15" font-weight="700" fill="#f6b94d" text-anchor="start"><tspan x="40" dy="0">R02 · WARNING · CANONICAL BLUEPRINT EDGES NOT AVAILABLE</tspan></text><text x="41" y="262" font-family="Arial" font-size="13" font-weight="400" fill="#f4f7fb" text-anchor="start"><tspan x="41" dy="0">No selected canonical blueprint with edge records was returned. Operation order is not a proof of</tspan><tspan x="41" dy="14.040000000000001">complete canonical semantics.</tspan></text><text x="40" y="317" font-family="Arial" font-size="15" font-weight="700" fill="#f6b94d" text-anchor="start"><tspan x="40" dy="0">R03 · WARNING · OBSERVABILITY CONTRACT NOT RETAINED</tspan></text><text x="41" y="344" font-family="Arial" font-size="13" font-weight="400" fill="#f4f7fb" text-anchor="start"><tspan x="41" dy="0">The reader did not retain a per-cell observation contract. Runtime state is separate and unobserved.</tspan></text><text x="40" y="399" font-family="Arial" font-size="15" font-weight="700" fill="#f6b94d" text-anchor="start"><tspan x="40" dy="0">R04 · WARNING · MONOTONIC PROGRESS NOT PROVEN</tspan></text><text x="41" y="426" font-family="Arial" font-size="13" font-weight="400" fill="#f4f7fb" text-anchor="start"><tspan x="41" dy="0">No complete semantic-progress proof was retained. Forward placement must not imply proven monotonicity.</tspan></text><a href="undefined"><text x="39" y="510" font-family="Arial" font-size="12" font-weight="700" fill="#45a7ff" text-anchor="start"><tspan x="39" dy="0">Return to selected blueprint</tspan></text></a><text x="40" y="533" font-family="Arial" font-size="8" font-weight="400" fill="#a8b8ca" text-anchor="start"><tspan x="40" dy="0">Estate 34 · capability view · snapshot 734ca73fdf67</tspan></text></svg>